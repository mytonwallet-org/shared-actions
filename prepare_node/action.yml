name: Prepare the Node environment

description: Shared steps to prepare the Node environment and the NPM packages

inputs:
  dont-install-npm-packages:
    description: 'If true, the NPM packages will not be installed'
    default: 'false'
  node-version:
    description: 'The Node.js version to use'
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Node modules
      if: inputs.dont-install-npm-packages != 'true'
      id: npm-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Install dependencies
      if: inputs.dont-install-npm-packages != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
      shell: bash
      # Retry: npm ci pulls a git-hosted dependency whose prepare sub-install
      # intermittently hits ECONNRESET and fails the whole build. Three attempts
      # with backoff turn that transient network flake into a non-event.
      run: |
        for i in 1 2 3; do
          npm ci && exit 0
          echo "::warning::npm ci attempt $i failed; retrying"
          npm cache clean --force || true
          sleep $((i * 20))
        done
        echo "::error::npm ci failed after 3 attempts"; exit 1
