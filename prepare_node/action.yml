name: Prepare the Node environment

description: Shared steps to prepare the Node environment and the NPM packages

inputs:
  dont-install-npm-packages:
    description: 'If true, the NPM packages will not be installed'
    default: 'false'
  node-version:
    description: 'The Node.js version to use'
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Node modules
      if: inputs.dont-install-npm-packages != 'true'
      id: npm-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        # runner.os is Linux on both x64 and arm64, so without the arch an entry written by one
        # architecture is restored by the other, and cache-hit then skips npm ci entirely.
        key: ${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-build-

    - name: Install dependencies
      if: inputs.dont-install-npm-packages != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
